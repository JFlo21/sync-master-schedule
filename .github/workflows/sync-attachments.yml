name: Smartsheet Attachment Sync

on:
  schedule:
    - cron: '0 5 * * *'  # Daily at 5:00 AM UTC (runs with --apply)
  workflow_dispatch:      # Manual trigger (defaults to dry run)
    inputs:
      mode:
        description: 'dry-run = plan only (no downloads/uploads); apply = copy attachments to both target sheets'
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run

# One sync at a time (it writes to both target sheets). A new run waits; an active
# run is never cancelled mid-upload.
concurrency:
  group: smartsheet-attachment-sync
  cancel-in-progress: false

jobs:
  sync-attachments:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: mkdir -p /tmp/smartsheet-attachments
      - name: Run Attachment Sync
        env:
          SMARTSHEET_API_KEY: ${{ secrets.SMARTSHEET_API_KEY }}
          # Routing is pinned in src/config.py (VERIFIED_ROUTES): Project List ->
          # master schedule (all files) and Project List -> Project List - Blank Copy
          # (PDFs only). No sheet or column IDs are passed here on purpose; the old
          # SOURCE_*/TARGET_* secrets are not used.
          SYNC_MODE: ${{ github.event_name == 'schedule' && 'apply' || inputs.mode || 'dry-run' }}
        run: |
          case "$SYNC_MODE" in
            apply) python main.py --apply ;;
            *) python main.py --dry-run ;;
          esac
      - name: Cleanup
        if: always()
        run: |
          if [ -d /tmp/smartsheet-attachments ]; then
            rm -rf /tmp/smartsheet-attachments/*
          fi
